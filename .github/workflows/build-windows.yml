name: Build RustDesk for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "rustdesk-master.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RustDesk source archive
        shell: pwsh
        run: |
          if (!(Test-Path "rustdesk-master.zip")) {
            throw "rustdesk-master.zip is missing from the repository."
          }
          Expand-Archive -Path "rustdesk-master.zip" -DestinationPath "$env:RUNNER_TEMP/rustdesk-src" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP/rustdesk-src" -Directory | Select-Object -First 1
          if (!$root -or !(Test-Path (Join-Path $root.FullName "Cargo.toml"))) {
            throw "The ZIP must contain the RustDesk source tree with Cargo.toml at its top level."
          }
          "RUSTDESK_SRC=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore hbb_common submodule
        shell: pwsh
        run: |
          $submodule = Join-Path $env:RUSTDESK_SRC "libs/hbb_common"
          if (!(Test-Path (Join-Path $submodule "Cargo.toml"))) {
            if (Test-Path $submodule) { Remove-Item $submodule -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $submodule) | Out-Null
            git clone --depth 1 https://github.com/rustdesk/hbb_common.git $submodule
          }
          if (!(Test-Path (Join-Path $submodule "Cargo.toml"))) {
            throw "Could not find libs/hbb_common/Cargo.toml after restoring the submodule."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake and NASM
        uses: lukka/get-cmake@latest

      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          Set-Location $env:RUSTDESK_SRC
          vcpkg install --triplet x64-windows-static
          if (!$env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner."
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # The bundled RustDesk opus binding expects headers under include/opus/,
          # while the vcpkg overlay may install the headers directly under include/.
          $opusInclude = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows-static/include"
          $opusHeader = Join-Path $opusInclude "opus/opus_multistream.h"
          if (!(Test-Path $opusHeader)) {
            $flatHeader = Join-Path $opusInclude "opus_multistream.h"
            if (Test-Path $flatHeader) {
              $opusDir = Join-Path $opusInclude "opus"
              New-Item -ItemType Directory -Force -Path $opusDir | Out-Null
              Get-ChildItem $opusInclude -Filter "*.h" -File | Copy-Item -Destination $opusDir -Force
            }
          }
          if (!(Test-Path $opusHeader)) {
            throw "Opus headers are missing: expected $opusHeader. Check the vcpkg opus overlay."
          }

      - name: Build RustDesk
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          Set-Location $env:RUSTDESK_SRC
          cargo build --release --locked
          $exe = Join-Path $env:RUSTDESK_SRC "target/release/rustdesk.exe"
          if (!(Test-Path $exe)) {
            throw "Build finished but target/release/rustdesk.exe was not found."
          }
          Copy-Item $exe "$env:GITHUB_WORKSPACE/rustdesk.exe" -Force

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: rustdesk.exe
          if-no-files-found: error
          retention-days: 14
